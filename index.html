<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E8ECF4">
  <title>Kaiju Audios</title>
  <link rel="icon" type="image/png" href="img/icono.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <div class="app">
    <header>
      <h1>Kaiju Audios</h1>
    </header>

    <div class="notice" id="notice" hidden></div>
    <nav class="picker" id="picker" aria-label="Elegir personaje"></nav>
    <main id="list"></main>
  </div>

  <div class="addbar">
    <button class="add" id="addBtn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/></svg>
      Agregar audios
    </button>
    <input type="file" id="fileInput" accept="audio/*" multiple hidden>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/kaijus.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
